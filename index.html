<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staj ve İş İlanı Panosu</title>
  <script src="form.js" defer></script>
</head>
<body>
  <header>
    <h1>Staj ve İş İlanı Panosu</h1>
    <nav aria-label="Ana gezinme">
      <a href="#ilanlar-bolumu">İlanlar</a>
      <a href="#basvuru-bolumu">Başvuru</a>
    </nav>
  </header>

  <main>
    <section id="ilanlar-bolumu">
      <h2>İlanlar</h2>
      <p id="durum" role="status"></p>
      <ul id="ilanlar"></ul>
    </section>

    <section id="basvuru-bolumu">
      <h2>Başvuru Formu</h2>
      <form id="basvuru">
        <div class="alan-grubu">
          <label for="ad-soyad">Ad soyad</label>
          <input id="ad-soyad" name="adSoyad" type="text" required autocomplete="name">
        </div>

        <div class="alan-grubu">
          <label for="eposta">E-posta</label>
          <input id="eposta" name="eposta" type="email" required autocomplete="email">
        </div>

        <div class="alan-grubu">
          <label for="telefon">Cep telefonu</label>
          <input
            id="telefon"
            name="telefon"
            type="tel"
            required
            pattern="05[0-9]{9}"
            title="05 ile başlayan 11 rakam girin (ör. 05321234567)"
            placeholder="05321234567"
            autocomplete="tel"
          >
        </div>

        <div class="alan-grubu">
          <label for="baglanti">GitHub ya da CV bağlantınız</label>
          <input id="baglanti" name="baglanti" type="url" required placeholder="https://github.com/kullanici">
        </div>

        <div class="alan-grubu">
          <label for="ilgi-alani">İlgilendiğiniz alan</label>
          <select id="ilgi-alani" name="ilgiAlani" required>
            <option value="">Seçiniz</option>
            <option value="on-yuz">Ön yüz</option>
            <option value="arka-uc">Arka uç</option>
            <option value="veri">Veri</option>
            <option value="sistem">Sistem</option>
          </select>
        </div>

        <div class="alan-grubu onay-grubu">
          <input id="onay" name="onay" type="checkbox" required>
          <label for="onay">Bilgilerimin bu başvuru için kullanılmasını kabul ediyorum.</label>
        </div>

        <button type="submit">Başvuruyu Gönder</button>
      </form>
      <p id="basvuru-ileti" role="status"></p>
    </section>
  </main>

  <footer>
    <p>Batu Ergül · 2026</p>
  </footer>
</body>
</html>
